server:
  port: 7002

spring:
  application:
    name: fastpay-demo
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# FAST 易支付配置
fastpay:
  # 商户编号（在商户平台获取）
  merchant-no: ${FASTPAY_DEMO_MERCHANT_NO:}
  # 店铺编号
  shopNo: ${FASTPAY_DEMO_SHOP_NO:}
  # API 密钥（在商户平台获取）
  api-secret: ${FASTPAY_DEMO_API_SECRET:}
  # 支付网关地址
  gateway-url: ${FASTPAY_DEMO_GATEWAY_URL:http://localhost:7001/fastpay-server}
  # 异步通知地址（需要外网可访问）
  notify-url: ${FASTPAY_DEMO_NOTIFY_URL:http://localhost:7002/pay/notify}
  # 同步跳转地址
  return-url: ${FASTPAY_DEMO_RETURN_URL:http://localhost:7002/pay/return}
