# Fast 易支付 - 服务端配置
server:
  port: ${FASTPAY_SERVER_INTERNAL_PORT:7001}
  servlet:
    context-path: ${FASTPAY_SERVER_CONTEXT_PATH:/fastpay-server}


spring:
  application:
    name: fastpay-server
  
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://fast_pay_mysql:3306/bigbear_fastpay?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:fastpay}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  
  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.fastpay.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}

# Knife4j API 文档配置
springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.fastpay.controller

knife4j:
  enable: ${KNIFE4J_ENABLED:false}
  setting:
    language: zh_cn

# Fast 易支付 自定义配置
fastpay:
  # JWT 配置
  jwt:
    secret: ${FASTPAY_JWT_SECRET:change-me-at-least-32-chars}
    # Token 有效期（小时）
    expire-hours: ${FASTPAY_JWT_EXPIRE_HOURS:12}
  
  # 管理员初始化账号；生产必须显式开启并提供强密码
  admin:
    init-enabled: ${FASTPAY_ADMIN_INIT_ENABLED:false}
    username: ${FASTPAY_ADMIN_USERNAME:}
    password: ${FASTPAY_ADMIN_PASSWORD:}

  # CORS 允许来源，多个来源用英文逗号分隔
  cors:
    allowed-origins: ${FASTPAY_CORS_ALLOWED_ORIGINS:*}

  # 是否公开 /api/info 接口，生产默认关闭
  api-info-enabled: ${FASTPAY_API_INFO_ENABLED:false}
  
  # 支付配置
  pay:
    # 订单超时时间（分钟）
    order-timeout-minutes: ${FASTPAY_ORDER_TIMEOUT_MINUTES:3}
    # 支付页面域名；留空时按请求 Host 自动推导
    page-domain: ${FASTPAY_PAY_PAGE_DOMAIN:}
  
  # 监听软件回调配置
  notify:
    # 监听软件回调地址；留空时按请求 Host 自动推导
    callback-url: ${FASTPAY_NOTIFY_CALLBACK_URL:}
