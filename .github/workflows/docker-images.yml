name: Build FastPay Docker Images

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/docker-images.yml'
      - 'deploy/**'
      - 'fastpay-admin/**'
      - 'fastpay-merchant/**'
      - 'fastpay-server/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: .
            file: deploy/gateway/Dockerfile
          - name: mysql
            context: .
            file: deploy/mysql/Dockerfile
          - name: server
            context: fastpay-server
            file: fastpay-server/Dockerfile
          - name: admin
            context: fastpay-admin
            file: fastpay-admin/Dockerfile
          - name: merchant
            context: fastpay-merchant
            file: fastpay-merchant/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
