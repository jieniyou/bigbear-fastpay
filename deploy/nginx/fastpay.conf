map $http_x_forwarded_proto $fast_pay_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location = / {
        return 302 /fastpay-merchant/;
    }

    location /fastpay-admin/ {
        proxy_pass http://fast_pay_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fast_pay_forwarded_proto;
    }

    location /fastpay-merchant/ {
        proxy_pass http://fast_pay_merchant;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fast_pay_forwarded_proto;
    }

    location /fastpay-server/ws/ {
        proxy_pass http://fast_pay_server:7001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fast_pay_forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /fastpay-server/ {
        proxy_pass http://fast_pay_server:7001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fast_pay_forwarded_proto;
    }
}
